<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-1: #0b1021;
            --bg-2: #0f172a;
            --panel: rgba(255, 255, 255, 0.04);
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #7c6bff;
            --primary-2: #5b8def;
            --accent: #38ef7d;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(124, 107, 255, 0.12), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(88, 193, 255, 0.12), transparent 35%),
                        linear-gradient(135deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            padding: 28px;
            color: var(--text);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(14px) saturate(130%);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45);
            overflow: hidden;
        }

        header {
            position: relative;
            padding: 64px 40px;
            background: linear-gradient(135deg, rgba(124, 107, 255, 0.24), rgba(91, 141, 239, 0.26));
            color: white;
            overflow: hidden;
        }

        header::before, header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.18), transparent 35%);
            filter: blur(40px);
            opacity: 0.8;
        }

        header::after {
            background: radial-gradient(circle at 70% 60%, rgba(56, 239, 125, 0.18), transparent 35%);
            opacity: 0.9;
        }

        header h1 {
            position: relative;
            z-index: 1;
            font-size: 38px;
            letter-spacing: -0.8px;
            font-weight: 700;
            text-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        header p {
            position: relative;
            z-index: 1;
            margin-top: 8px;
            font-size: 17px;
            opacity: 0.9;
            font-weight: 400;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 14px 26px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--border);
        }

        nav a {
            color: rgba(226, 232, 240, 0.8);
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
            position: relative;
            transition: all 0.2s ease;
        }

        nav a:hover { color: white; background: rgba(124, 107, 255, 0.12); }

        nav a.active {
            color: white;
            background: linear-gradient(135deg, rgba(124, 107, 255, 0.25), rgba(91, 141, 239, 0.25));
            box-shadow: 0 8px 24px rgba(124, 107, 255, 0.35);
        }

        .content { padding: 42px; background: transparent; }

        .tool-status {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .tool-status h3 { margin-bottom: 12px; color: var(--text); font-weight: 700; font-size: 17px; }

        .tool-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 8px 12px 8px 0;
            padding: 10px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }

        .tool-item:hover { transform: translateY(-2px); transition: transform 0.2s ease; }
        .tool-available { color: #38ef7d; }
        .tool-unavailable { color: #fca5a5; }

        .alert {
            padding: 16px 18px;
            border-radius: 14px;
            margin: 18px 0;
            border: 1px solid var(--border);
            font-weight: 600;
            background: rgba(255,255,255,0.03);
        }
        .alert strong { margin-right: 6px; }
        .alert-error { border-left: 4px solid #ef4444; color: #fecdd3; }
        .alert-info { border-left: 4px solid #38bdf8; color: #c4e8ff; }
        .alert-warning { border-left: 4px solid #f59e0b; color: #ffecc2; }
        .alert-success { border-left: 4px solid #22c55e; color: #bbf7d0; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.4px;
            color: var(--muted);
            text-transform: uppercase;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            color: var(--text);
            font-size: 15px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: rgba(124, 107, 255, 0.7);
            box-shadow: 0 0 0 4px rgba(124, 107, 255, 0.18);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            padding: 14px 22px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(124, 107, 255, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(124, 107, 255, 0.45); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35); }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0,0,0,0.35); }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(124, 107, 255, 0.16);
            color: #c7d2fe;
            border: 1px solid rgba(124, 107, 255, 0.4);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--muted);
            font-weight: 600;
            font-size: 13px;
        }

        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px 16px; }
        thead tr { background: linear-gradient(135deg, rgba(124, 107, 255, 0.35), rgba(91, 141, 239, 0.35)); color: white; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s ease; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }

        .results-box {
            background: linear-gradient(135deg, #0f172a, #0b1021);
            color: #e2e8f0;
            padding: 22px;
            border-radius: 16px;
            margin: 20px 0;
            max-height: 520px;
            overflow-y: auto;
            border: 1px solid var(--border);
            font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }

        .finding {
            margin: 12px 0;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            background: rgba(255,255,255,0.04);
        }

        footer {
            text-align: center;
            padding: 26px;
            color: var(--muted);
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }
    </style>
        

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 CyberAuditX</h1>
            <p>Automated Security Scanning & Vulnerability Assessment</p>
        </header>
        
        <nav>
            <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>🏠 Home</a>
            <a href="{{ url_for('automated_page') }}" {% if request.endpoint == 'automated_page' %}class="active"{% endif %}>🤖 Automated</a>
            <a href="{{ url_for('nmap_page') }}" {% if request.endpoint == 'nmap_page' %}class="active"{% endif %}>🌐 Nmap</a>
            <a href="{{ url_for('nikto_page') }}" {% if request.endpoint == 'nikto_page' %}class="active"{% endif %}>🔍 Nikto</a>
            <a href="{{ url_for('sqlmap_page') }}" {% if request.endpoint == 'sqlmap_page' %}class="active"{% endif %}>💉 SQLMap</a>
        </nav>
        
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        
        <footer>
            <p>&copy; 2026 CyberAuditX | Automated Security Testing Platform</p>
        </footer>
    </div>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
