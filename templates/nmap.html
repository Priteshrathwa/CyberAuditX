{% extends "base.html" %}

{% block title %}Nmap Scanner - CyberAuditX{% endblock %}

{% block content %}
<h2>🌐 Nmap Network Scanner</h2>

<div class="scan-form">
    <form id="nmapForm">
        <div class="form-group">
            <label for="target">Target (IP or Hostname) *</label>
            <input type="text" id="target" name="target" placeholder="e.g., 192.168.1.1 or example.com" required>
            <small>Command: nmap -sV &lt;target&gt;</small>
        </div>
        
        <button type="submit" class="btn" id="scanBtn">🚀 Start Scan</button>
    </form>
</div>

<div id="loadingDiv" class="loading" style="display: none;">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: #e2e8f0; font-size: 18px;">Scanning in progress... This may take a few minutes.</p>
</div>

<div id="errorDiv" style="display: none;"></div>

<div id="resultsDiv" class="results-container" style="display: none;">
    <h3 style="color: #e2e8f0; margin-bottom: 20px;">📊 Scan Results</h3>
    <div id="resultsContent"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('nmapForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const scanBtn = document.getElementById('scanBtn');
    const loadingDiv = document.getElementById('loadingDiv');
    const resultsDiv = document.getElementById('resultsDiv');
    const errorDiv = document.getElementById('errorDiv');
    
    // Hide previous results
    resultsDiv.style.display = 'none';
    errorDiv.style.display = 'none';
    
    // Show loading
    loadingDiv.style.display = 'block';
    scanBtn.disabled = true;
    
    try {
        const response = await fetch('/scan/nmap', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        loadingDiv.style.display = 'none';
        scanBtn.disabled = false;
        
        if (data.error) {
            errorDiv.innerHTML = `<div class="alert alert-error"><strong>Error:</strong> ${data.error}</div>`;
            errorDiv.style.display = 'block';
        } else {
            displayResults(data.results, data.filepath);
            resultsDiv.style.display = 'block';
        }
    } catch (error) {
        loadingDiv.style.display = 'none';
        scanBtn.disabled = false;
        errorDiv.innerHTML = `<div class="alert alert-error"><strong>Error:</strong> ${error.message}</div>`;
        errorDiv.style.display = 'block';
    }
});

function displayResults(results, filepath) {
    const container = document.getElementById('resultsContent');
    const summary = results.summary || {};
    
    let html = `
        <div style="background: rgba(255, 255, 255, 0.04); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.08);">
            <p style="color: #e2e8f0;"><strong>Target:</strong> ${results.target}</p>
            <p style="color: #e2e8f0;"><strong>Scan Type:</strong> Service Version Detection (nmap -sV)</p>
            <p style="color: #e2e8f0;"><strong>Timestamp:</strong> ${results.timestamp}</p>
            <p style="color: #e2e8f0;"><strong>Total Ports:</strong> ${summary.total_ports || 0}</p>
            <p style="color: #e2e8f0;"><strong>Open Ports:</strong> <span style="color: #38ef7d; font-weight: 600;">${summary.open_ports || 0}</span></p>
        </div>
    `;
    
    if (results.ports && results.ports.length > 0) {
        html += `
            <div style="background: rgba(255, 255, 255, 0.04); padding: 20px; border-radius: 8px; margin: 15px 0; border: 1px solid rgba(255, 255, 255, 0.08);">
                <h4 style="color: #e2e8f0; margin-bottom: 15px;">PORT STATE SERVICE VERSION</h4>
                <table style="width: 100%; border-collapse: collapse; background: rgba(17, 24, 39, 0.5);">
                    <thead>
                        <tr style="background: rgba(124, 107, 255, 0.3); color: #e2e8f0;">
                            <th style="padding: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1);">PORT</th>
                            <th style="padding: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1);">STATE</th>
                            <th style="padding: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1);">SERVICE</th>
                            <th style="padding: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1);">VERSION</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        results.ports.forEach((port, index) => {
            const rowColor = index % 2 === 0 ? 'rgba(255, 255, 255, 0.03)' : 'rgba(255, 255, 255, 0.01)';
            const stateColor = port.state === 'open' ? '#38ef7d' : '#ef5350';
            html += `
                <tr style="background: ${rowColor};">
                    <td style="padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08); font-family: monospace; color: #e2e8f0;">${port.port}</td>
                    <td style="padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08); color: ${stateColor}; font-weight: bold;">${port.state}</td>
                    <td style="padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08); color: #94a3b8;">${port.service}</td>
                    <td style="padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08); font-family: monospace; font-size: 0.9em; color: #94a3b8;">${port.version || ''}</td>
                </tr>
            `;
        });
        
        html += `
                    </tbody>
                </table>
            </div>
        `;
    } else {
        html += `
            <div style="background: rgba(255, 193, 7, 0.1); padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                <p style="margin: 0; color: #ffc107;">No open ports found or scan did not complete successfully.</p>
            </div>
        `;
    }
    
    html += `
        <div style="margin-top: 20px; display: flex; gap: 15px;">
            <a href="/download/${filepath.split('/').pop()}" class="btn">💾 Download Results</a>
            <button onclick="getAIAnalysis()" class="btn" id="aiAnalyzeBtn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">🤖 AI Analysis</button>
        </div>
        
        <div id="aiAnalysisSection" style="display: none; margin-top: 30px;">
            <h3 style="color: #e2e8f0; margin-bottom: 20px;">🤖 AI-Powered Analysis</h3>
            <div id="aiAnalysisContent"></div>
        </div>
    `;
    
    container.innerHTML = html;
    
    // Store results globally for AI analysis
    window.currentScanResults = results;
}

async function getAIAnalysis() {
    const btn = document.getElementById('aiAnalyzeBtn');
    const section = document.getElementById('aiAnalysisSection');
    const content = document.getElementById('aiAnalysisContent');
    
    btn.disabled = true;
    btn.textContent = '🔄 Analyzing...';
    
    content.innerHTML = `
        <div style="text-align: center; padding: 40px;">
            <div class="spinner"></div>
            <p style="margin-top: 20px; color: #94a3b8;">AI is analyzing your scan results...</p>
        </div>
    `;
    section.style.display = 'block';
    
    try {
        const response = await fetch('/api/analyze/nmap', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({results: window.currentScanResults})
        });
        
        const analysis = await response.json();
        
        if (analysis.error) {
            content.innerHTML = `
                <div style="background: rgba(239, 83, 80, 0.1); padding: 20px; border-radius: 8px; border-left: 4px solid #ef5350;">
                    <p style="color: #ef5350; margin: 0;"><strong>❌ Error:</strong> ${sanitizeHTML(analysis.error)}</p>
                </div>
            `;
        } else if (Object.keys(analysis).length === 0) {
            content.innerHTML = `
                <div style="background: rgba(255, 193, 7, 0.1); padding: 20px; border-radius: 8px; border-left: 4px solid #ffc107;">
                    <p style="color: #ffc107; margin: 0;"><strong>⚠️ Warning:</strong> AI returned empty results. Please try again.</p>
                </div>
            `;
        } else {
            displayAIAnalysis(analysis);
        }
        
        btn.textContent = '✅ Analysis Complete';
    } catch (error) {
        content.innerHTML = `
            <div style="background: rgba(239, 83, 80, 0.1); padding: 20px; border-radius: 8px; border-left: 4px solid #ef5350;">
                <p style="color: #ef5350; margin: 0;"><strong>❌ Error:</strong> Failed to get AI analysis: ${sanitizeHTML(error.message)}</p>
            </div>
        `;
        btn.textContent = '❌ Analysis Failed';
        btn.disabled = false;
    }
}

function sanitizeHTML(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function displayAIAnalysis(analysis) {
    const content = document.getElementById('aiAnalysisContent');
    
    let html = `
        <div style="background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); padding: 25px; border-radius: 12px; border: 1px solid rgba(102, 126, 234, 0.3); margin-bottom: 20px;">
            <h4 style="color: #667eea; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600;">
                <span>📝</span> Network Analysis Summary
            </h4>
            <p style="color: #e2e8f0; line-height: 1.8; font-size: 14px; margin: 0;">${sanitizeHTML(analysis.summary || 'No summary available')}</p>
        </div>
    `;
    
    if (analysis.risks && analysis.risks.length > 0) {
        html += `
            <div style="background: rgba(239, 83, 80, 0.1); padding: 25px; border-radius: 12px; border: 1px solid rgba(239, 83, 80, 0.3); margin-bottom: 20px;">
                <h4 style="color: #ef5350; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600;">
                    <span>⚠️</span> Security Risks (${analysis.risks.length})
                </h4>
                <ul style="color: #e2e8f0; line-height: 2; margin: 0 0 0 25px; padding: 0; font-size: 14px;">
                    ${analysis.risks.map(risk => `<li style="margin-bottom: 8px;">${sanitizeHTML(risk)}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    if (analysis.recommendations && analysis.recommendations.length > 0) {
        html += `
            <div style="background: rgba(56, 239, 125, 0.1); padding: 25px; border-radius: 12px; border: 1px solid rgba(56, 239, 125, 0.3);">
                <h4 style="color: #38ef7d; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600;">
                    <span>💡</span> Recommendations (${analysis.recommendations.length})
                </h4>
                <ol style="color: #e2e8f0; line-height: 2; margin: 0 0 0 25px; padding: 0; font-size: 14px;">
                    ${analysis.recommendations.map(rec => `<li style="margin-bottom: 8px;">${sanitizeHTML(rec)}</li>`).join('')}
                </ol>
            </div>
        `;
    }
    
    content.innerHTML = html;
}
</script>
{% endblock %}
