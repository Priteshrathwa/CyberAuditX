{% extends "base.html" %}

{% block title %}Scan Results - CyberAuditX{% endblock %}

{% block content %}
<h2>📊 Scan Results</h2>

<div style="background: #ecf0f1; padding: 20px; border-radius: 8px; margin: 20px 0;">
    <p><strong>File:</strong> {{ filename }}</p>
</div>

<div class="results-box">
    <pre>{{ content }}</pre>
</div>

<div style="margin-top: 20px;">
    <a href="{{ url_for('download_results', filename=filename) }}" class="btn">💾 Download Results</a>
    <a href="{{ url_for('index') }}" class="btn" style="background: #95a5a6; margin-left: 10px;">🏠 Back to Home</a>
</div>
{% endblock %}
